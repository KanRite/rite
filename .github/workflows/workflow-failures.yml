name: Workflow failures

# Ticket 348: a workflow that fails and that nobody opens is no check. When a
# listed workflow finishes on main, on a schedule or for a release, a failure
# opens a GitHub issue (or comments on the open one) and a later pass closes
# it. rite's issue import turns an open issue into a TRIAGE ticket, so a red
# workflow reaches the board and My work. scripts/workflow-report.sh does it.
#
# Not for pull requests: a red PR check is normal while a change is made, and
# its author sees it. Not for Dependabot's branches, whose failures the
# Dependabot gate already raises its own issues for.
#
# `workflow_run` needs the workflows named, so every workflow in this folder
# is listed (scripts/check-failure-reporter.sh, in CI, fails when one isn't).
# Nothing here can notice a workflow that never runs.
#
# Self-test (Actions > Workflow failures > Run workflow, or
# `gh workflow run workflow-failures.yml -f result=failed`, then
# `-f result=passed`): opens, then closes, the issue "Workflow failed:
# self-test (main)" through the same script and token as a real failure. Run
# it after ISSUE_GENERATOR_TOKEN is renewed: when the token lapses this job
# fails, and nothing reports the reporter. The issue becomes a TRIAGE ticket
# like any other; mark it done once it's seen. It sends a notification too,
# and fails if it can't, so it also checks NTFY_TOPIC.
#
# ntfy (ticket 321): each issue opened, commented on or closed is also sent as
# a push notification, to the topic in the secret NTFY_TOPIC. On ntfy.sh a
# topic is its own password, so it's long, random and never printed. A real
# report without it, or that ntfy refuses, warns and still raises the issue.

on:
  workflow_run:
    workflows:
      - CI
      - "CodeQL Advanced"
      - Dependabot gate
      - Dependabot gate (closed)
      - Pages
      - Release
    types: [completed]
  workflow_dispatch:
    inputs:
      result:
        description: "failed opens the self-test issue; passed closes it"
        type: choice
        options: [failed, passed]
        default: failed

# The issues are written with the repository secret ISSUE_GENERATOR_TOKEN,
# not the job's own token, which only checks the repository out.
permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Main, or a release tag (a `v` tag pushed); never a pull request or one
    # of Dependabot's branches. Cancelled, skipped and neutral runs say
    # nothing either way.
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.event != 'pull_request'
      && github.event.workflow_run.event != 'pull_request_target'
      && !startsWith(github.event.workflow_run.head_branch, 'dependabot/')
      && (github.event.workflow_run.head_branch == github.event.repository.default_branch
          || (github.event.workflow_run.event == 'push'
              && startsWith(github.event.workflow_run.head_branch, 'v')))
      && contains(fromJSON('["failure", "timed_out", "success"]'), github.event.workflow_run.conclusion)
    steps:
      - uses: actions/checkout@v7
      # The run's details come in the environment, not in the script's text:
      # a branch name is data, not a command.
      #
      # CI's scheduled and manual runs are the full suite (every platform,
      # ticket 328) and a push to main is Linux only, so they're reported as
      # two workflows: otherwise a Linux-only pass would close the issue a
      # Windows or macOS failure in the full suite opened.
      - name: Open or close the issue for ${{ github.event.workflow_run.name }}
        env:
          GH_TOKEN: ${{ secrets.ISSUE_GENERATOR_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "${WORKFLOW}" = "CI" ] && { [ "${EVENT}" = "schedule" ] || [ "${EVENT}" = "workflow_dispatch" ]; }; then
            export WORKFLOW="CI (full suite)"
          fi
          if [ "${CONCLUSION}" = "success" ]; then
            scripts/workflow-report.sh passed
          else
            scripts/workflow-report.sh failed
          fi

  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - name: Self-test, ${{ inputs.result }}
        env:
          GH_TOKEN: ${{ secrets.ISSUE_GENERATOR_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_STRICT: "1"
          WORKFLOW: self-test
          BRANCH: ${{ github.ref_name }}
          EVENT: workflow_dispatch
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ inputs.result }}
        run: scripts/workflow-report.sh "${RESULT}"
