name: Dependabot gate

# Ticket 247: what happens to Dependabot's PRs. Dependabot opens one only
# once a release is a week old (its cooldown, in dependabot.yml). Then
# scripts/dependabot-gate.sh checks each one: compatible (a patch, or a minor
# of 1.x or later), no security advisory for the versions it brings, CI
# passed. Ready ones are approved (as the code owner whose token is
# DEPENDABOT_APPROVER_TOKEN) and auto-merged; one held by an advisory is
# looked at again each week; the rest get an issue, which reaches the
# KanRite board as a TRIAGE ticket.
#
# Approving happens only in the weekly and manual runs: workflows Dependabot
# starts can't read Actions secrets, so those runs only assess.
#
# No pull_request trigger (ticket 250): it listed this workflow's jobs as
# skipped checks on every PR. A Dependabot PR is assessed when its CI
# finishes instead (CI runs on every push to it), and those runs aren't
# PR checks. Closing a PR's issue is dependabot-gate-closed.yml.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: dependabot-gate
  cancel-in-progress: false

jobs:
  assess:
    if: >-
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
      && github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: scripts/dependabot-gate.sh assess "$PR"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}

  apply:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/dependabot-gate.sh apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVER_TOKEN: ${{ secrets.DEPENDABOT_APPROVER_TOKEN }}
