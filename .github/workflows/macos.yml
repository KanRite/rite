name: macOS

# macOS (ticket 345): release.yml ships rite and riteui for macOS, and nothing
# else tests them there. A run takes about nine minutes, so it isn't a check on
# every pull request: it runs by hand (Actions > macOS > Run workflow, or
# `gh workflow run macos.yml`) and every Tuesday at 11:00 London time, the day
# before release day (Wednesday; kanrite-documents' docs/WAYS_OF_WORKING.md),
# so a macOS problem shows up before a release rather than in one. GitHub can
# start a scheduled run hours late (2 November's 10:30 run started at 20:28
# UTC), so a Tuesday morning slot still reports before Wednesday. It is its own
# workflow, so running it doesn't run CI's jobs, and the Dependabot gate (which
# reads `rust` and `shell`) never waits for it. A default macOS volume ignores
# case like NTFS, so this is where the third kind of disk is tested (ticket
# 338).
#
# Scheduled workflows run on the default branch, and GitHub stops them after 60
# days with no repository activity.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 2'
      timezone: "Europe/London"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The desktop board is a Tauri app: WKWebView ships with macOS, so no
      # system libraries to install.
      - name: Install Rust (stable + wasm32)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build the desktop board's front end
        working-directory: crates/rite-ui-web
        run: trunk build --release
      # Every crate's tests in one run, all of them even when one fails.
      - name: Unit tests
        run: cargo test --locked --workspace --no-fail-fast
      # tests/test.sh uses GNU sed -i and date -d, which macOS's BSD tools
      # lack. It tests the rite binary, which is what ships, not the script,
      # so GNU's tools go first on the PATH rather than the script being
      # made portable.
      - name: GNU tools for tests/test.sh
        if: ${{ !cancelled() }}
        run: |
          brew install gnu-sed coreutils
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Versions
        if: ${{ !cancelled() }}
        run: |
          bash --version | head -1
          git --version
          sed --version | head -1
          diskutil info / | grep -iE "file system personality|type \(bundle\)"
      - name: CLI tests
        if: ${{ !cancelled() }}
        run: bash tests/test.sh
