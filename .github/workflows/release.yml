name: Release

# Tag a release (git tag -a vX.Y.Z && git push --tags) and this builds both
# binaries for every platform, creates the GitHub Release, and attaches
# amd-<target>.zip to it — which is what install.sh downloads.
#
# rite's own workflow rather than lite-actions/rust-release (ticket 085): the
# desktop board (riteui) is a Tauri app whose page is built to WebAssembly by
# Trunk and embedded at compile time, and on Linux it needs WebKitGTK. A plain
# `cargo build` can't make it, so those steps live here, beside the one app
# that needs them. The page is built once, on Linux (board-page.yml, ticket
# 328), and every platform's build embeds that same copy, so all six zips ship
# the same page and the Arm Windows runner never runs Tailwind.
#
# A pull request that changes this file or board-page.yml, or a run by hand
# (workflow_dispatch), is a dry run: it builds every platform and keeps the
# zips as workflow artifacts, and creates no release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths: [".github/workflows/release.yml", ".github/workflows/board-page.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  page:
    uses: ./.github/workflows/board-page.yml

  build:
    needs: page
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-latest }
          # Built on the Apple-silicon runner, cross-compiled to Intel.
          - { target: x86_64-apple-darwin, runner: macos-latest, cross: true }
          # Windows (ticket 281): WebView2 ships with Windows 10 and 11, so
          # no system libraries, and the C runtime is linked in (ticket 333);
          # the binaries are rite.exe and riteui.exe.
          - { target: x86_64-pc-windows-msvc, runner: windows-latest, exe: .exe }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, exe: .exe }
    runs-on: ${{ matrix.runner }}
    # Usually 7-20 minutes (Windows the longest).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The desktop board (crates/rite-ui) is a Tauri app: WebKitGTK on Linux.
      # Retries and a limit, as in ci.yml (ticket 327).
      - name: Install the desktop board's system libraries
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: scripts/apt-install.sh libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libasound2-dev

      # bash everywhere: Windows' default shell, PowerShell, can't read the
      # `\` line continuation.
      - name: Install Rust (stable, ${{ matrix.target }})
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # riteui embeds the board's page at compile time, so it comes first:
      # the one copy board-page.yml built.
      - uses: actions/download-artifact@v8
        with:
          name: board-page
          path: crates/rite-ui-web/dist

      - name: Build rite and riteui
        run: cargo build --release --locked --target ${{ matrix.target }} -p rite-cli -p rite-ui

      # Both binaries start and name themselves (riteui's --version needs no
      # window). Skipped where the runner can't run the target.
      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          target/${{ matrix.target }}/release/rite${{ matrix.exe }} --version
          target/${{ matrix.target }}/release/riteui${{ matrix.exe }} --version

      # The runners have the VC++ Redistributable, so a program needing it
      # still starts there; read the imports instead (ticket 333).
      - name: No Visual C++ runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/check-windows-dlls.ps1 target/${{ matrix.target }}/release/rite.exe target/${{ matrix.target }}/release/riteui.exe

      - name: Package amd-${{ matrix.target }}.zip
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/rite" "target/${{ matrix.target }}/release/riteui" "${stage}/"
          # Also under the 4.x names (ticket 311): a 4.x install updates by
          # taking `amd` and `amdui` from this zip, and the first 5.x run
          # puts in the new names. Windows had no 4.x release, so its zip
          # doesn't need them.
          cp "${stage}/rite" "${stage}/amd"
          cp "${stage}/riteui" "${stage}/amdui"
          (cd "${stage}" && zip -q "${GITHUB_WORKSPACE}/amd-${{ matrix.target }}.zip" rite riteui amd amdui)
          unzip -l "amd-${{ matrix.target }}.zip"

      # The Windows runners have no zip in their bash.
      - name: Package amd-${{ matrix.target }}.zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = "target/${{ matrix.target }}/release"
          $zip = "amd-${{ matrix.target }}.zip"
          Compress-Archive -Path "$release/rite.exe", "$release/riteui.exe" -DestinationPath $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          $archive.Entries | ForEach-Object { "{0,10}  {1}" -f $_.Length, $_.FullName }
          $archive.Dispose()

      - uses: actions/upload-artifact@v7
        with:
          name: amd-${{ matrix.target }}
          path: amd-${{ matrix.target }}.zip

  # One job creates the release and attaches every zip, so the release is
  # made by the workflow, never by hand. A platform whose build failed is
  # left out with a warning rather than holding the others back: install.sh
  # falls back to a source build where there's no zip.
  release:
    needs: build
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The zips only, not the board's page.
      - uses: actions/download-artifact@v8
        with:
          pattern: amd-*
          path: dist
          merge-multiple: true

      - name: Create the release and attach the zips
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          ls dist/*.zip >/dev/null 2>&1 || { echo "::error::No zips were built"; exit 1; }
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin \
            x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            [ -f "dist/amd-${target}.zip" ] || echo "::warning::No zip for ${target}: its build failed"
          done
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --title "${TAG}" --generate-notes
          fi
          gh release upload "${TAG}" dist/*.zip --clobber
