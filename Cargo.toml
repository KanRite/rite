# One library, two interfaces (docs/adr/0004): rite-lib, the `amd` command
# line, and the `amdui` desktop board — a Tauri backend (rite-ui) with a
# Leptos front end compiled to WebAssembly (rite-ui-web) and the types the two
# share (rite-ui-model).
#
# The boundary is enforced here rather than by review — rite-lib does not list
# clap, inquire, Tauri or Leptos, so a front-end dependency reaching into the
# library fails to compile rather than passing review.
[workspace]
resolver = "3"
members = [
    "crates/rite-lib",
    "crates/rite-cli",
    "crates/rite-ui",
    "crates/rite-ui-model",
    "crates/rite-ui-web",
    "crates/xtask",
]

[workspace.package]
version = "5.0.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/kanrite/rite"
license = "MIT"

[workspace.dependencies]
rite-lib = { path = "crates/rite-lib" }
rite-ui-model = { path = "crates/rite-ui-model" }
anyhow = "1"
clap = { version = "4", features = ["derive", "string", "wrap_help"] }
clap_complete = "4"
deunicode = "1.6.2"
# canonicalize without Windows' `\\?\` prefix (ticket 279); plain canonicalize elsewhere
dunce = "1"
inquire = "0.9"
libc = "0.2.189"
# serde is a feature since MiniJinja 3; templates render serde contexts.
minijinja = { version = "3", features = ["serde"] }
richrs = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }

# The desktop board (crates/rite-ui*).
tauri = "2.12"
tauri-build = "2.7"
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.23"
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
# The bottom panel's terminal (ticket 185): the engine Alacritty and Zed use.
alacritty_terminal = "0.26"
# Speech to text (ticket 187): Whisper on the CPU, the microphone, and the
# one-off model download.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
cpal = "0.18"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Dependencies without debug information (ticket 187): candle's made the
# debug build big enough to fill a CI runner's disk while linking amdui
# (the linker died with a bus error). Our own crates keep theirs.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
